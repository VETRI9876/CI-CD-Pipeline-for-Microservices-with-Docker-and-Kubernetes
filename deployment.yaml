apiVersion: apps/v1
kind: Deployment
metadata:
  name: microservice-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: microservice-app
  template:
    metadata:
      labels:
        app: microservice-app
    spec:
      containers:
      - name: microservice-app
        image: microservice-app:latest
        ports:
        - containerPort: 5000
---
apiVersion: v1
kind: Service
metadata:
  name: microservice-app
spec:
  type: NodePort
  selector:
    app: microservice-app
  ports:
    - protocol: TCP
      port: 80
      targetPort: 5000
      nodePort: 30001
